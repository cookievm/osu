# oily: builds the o!ily render engine for Windows and publishes it as a GitHub release,
# which the o!ily companion app downloads. Push a tag like "engine-2026.1028.0" or run it by hand.
name: o!ily engine release

on:
  push:
    tags:
      - 'engine-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example engine-2026.1028.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        run: dotnet publish osu.Desktop -c Release -r win-x64 --self-contained true -p:Version=0.0.0 -o publish

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath oily-engine-win-x64.zip

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create $env:TAG oily-engine-win-x64.zip `
            --target $env:GITHUB_SHA `
            --title "o!ily engine $env:TAG" `
            --notes "Render engine for the o!ily companion app. The app downloads this by itself; there's nothing to install by hand."
